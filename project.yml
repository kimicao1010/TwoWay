name: TwoWay

options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_OBJC_ARC: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    # @testable import 依赖它；xcodegen 默认不开，缺了会报
    # 「module built without '-enable-testing'」
    Debug:
      ENABLE_TESTABILITY: YES
      # xcodegen 默认不定义 DEBUG 条件编译标志，#if DEBUG 全部失效
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

targets:
  TwoWay:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        # 应用名 2way，但 Swift 模块名不能以数字开头，故内部标识统一用 TwoWay
        PRODUCT_NAME: 2way
        PRODUCT_MODULE_NAME: TwoWay
        PRODUCT_BUNDLE_IDENTIFIER: com.kimi.2way

        # D5：自签证书签名。禁止 ad-hoc（codesign -s -），详见 TECH_PLAN §9
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "2way Local Signing"
        CODE_SIGNING_REQUIRED: YES
        ENABLE_HARDENED_RUNTIME: NO

        SWIFT_STRICT_CONCURRENCY: complete
        COMBINE_HIDPI_IMAGES: YES

        # App 图标：`Sources/Resources/Assets.xcassets/AppIcon.appiconset`
        # （由根目录 `2way.iconset` 的 10 个尺寸拷入；actool 编译进 Assets.car，
        #  Dock / Finder / Cmd-Tab / 关于窗口统一生效）
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleName: 2way
        CFBundleDisplayName: 2way
        CFBundlePackageType: APPL
        # macOS 11+ 的图标键：指向 Asset Catalog 里的 AppIcon 图标集
        # （xcodegen 生成静态 Info.plist，不会像 Xcode 那样由 actool 自动注入该键，故显式声明）
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.utilities
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        # v1.1：二维码仅支持图片导入，不申请摄像头权限。
        # 故此处**不得**声明 NSCameraUsageDescription —— 这是 C2-6 的验收判据之一
        # （PRD §7.4 导入图片 AC 末条），也为将来沙盒化省掉
        # com.apple.security.device.camera entitlement。

  # 测试只覆盖 Services / Domain 层（TECH_PLAN §6 纪律）；UI 层走手工回归
  TwoWayTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: TwoWay
    settings:
      base:
        PRODUCT_NAME: TwoWayTests
        PRODUCT_MODULE_NAME: TwoWayTests
        PRODUCT_BUNDLE_IDENTIFIER: com.kimi.2way.tests
        GENERATE_INFOPLIST_FILE: YES
        # xcodegen 会按 target 名推断宿主路径（TwoWay.app），但 PRODUCT_NAME 是 2way.app，
        # 需要显式指正，否则报「Could not find test host」
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/2way.app/Contents/MacOS/2way"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  TwoWay:
    build:
      targets:
        TwoWay: all
        TwoWayTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TwoWayTests
