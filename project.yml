name: TwoWay

options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_OBJC_ARC: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  TwoWay:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        # 应用名 2way，但 Swift 模块名不能以数字开头，故内部标识统一用 TwoWay
        PRODUCT_NAME: 2way
        PRODUCT_MODULE_NAME: TwoWay
        PRODUCT_BUNDLE_IDENTIFIER: com.kimi.2way

        # D5：自签证书签名。禁止 ad-hoc（codesign -s -），详见 TECH_PLAN §9
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "2way Local Signing"
        CODE_SIGNING_REQUIRED: YES
        ENABLE_HARDENED_RUNTIME: NO

        SWIFT_STRICT_CONCURRENCY: complete
        COMBINE_HIDPI_IMAGES: YES

    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleName: 2way
        CFBundleDisplayName: 2way
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.utilities
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        # v1.1：二维码仅支持图片导入，不申请摄像头权限。
        # 故此处**不得**声明 NSCameraUsageDescription —— 这是 C2-6 的验收判据之一
        # （PRD §7.4 导入图片 AC 末条），也为将来沙盒化省掉
        # com.apple.security.device.camera entitlement。
